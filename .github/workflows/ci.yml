name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Android-first: JVM unit tests + Android assemble + emulator launch smoke.
# iOS KMP targets stay in the project for later; no iOS CI until M3.

jobs:
  jvm-android:
    name: JVM tests + Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate AutoFlow automation templates
        run: ./gradlew :core:validateAutoflowTemplates --stacktrace

      - name: Protocol + BLE + AI + core unit tests (JVM)
        run: ./gradlew :plaud-protocol:jvmTest :ble:jvmTest :core:jvmTest :ai:jvmTest --stacktrace

      - name: Assemble signed debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Assemble release APK (R8 minify)
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Assert arm64-v8a native libs packaged
        run: |
          set -euo pipefail
          APK=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          echo "Checking $APK"
          unzip -l "$APK" | tee /tmp/apk-listing.txt
          grep -E 'lib/arm64-v8a/libvelum_needle\.so' /tmp/apk-listing.txt
          grep -E 'lib/arm64-v8a/libc\+\+_shared\.so' /tmp/apk-listing.txt
          # network_security_config must be in the APK resources
          unzip -p "$APK" resources.arsc >/dev/null
          # Template catalogs must be on the Android classpath (classLoader resources).
          grep -E 'plaud_templates\.jsonl$' /tmp/apk-listing.txt
          grep -E 'plaud_templates_full\.jsonl\.gz$' /tmp/apk-listing.txt
          grep -E 'autoflow_templates\.jsonl$' /tmp/apk-listing.txt

      - name: Assert 16 KB page-size compatibility
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APK=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          ZIPALIGN="$SDK/build-tools/35.0.0/zipalign"
          READELF=$(ls "$SDK"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf 2>/dev/null | head -1 || true)
          if [ -z "${READELF}" ]; then
            READELF=$(command -v llvm-readelf || command -v readelf)
          fi
          echo "zipalign=$ZIPALIGN"
          echo "readelf=$READELF"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          TMP=$(mktemp -d)
          unzip -q "$APK" "lib/*/*.so" -d "$TMP" || true
          fail=0
          checked=0
          while IFS= read -r -d '' so; do
            # Play 16 KB rule is for 64-bit ABIs. Skip 32-bit (armeabi-v7a / x86);
            # their libc++_shared may legitimately stay 4 KB-aligned.
            case "$so" in
              */lib/armeabi-v7a/*|*/lib/x86/*) continue ;;
            esac
            checked=$((checked + 1))
            aligns=$("$READELF" -lW "$so" | awk '/LOAD/ { print $NF }')
            echo "=== ${so#"$TMP/"} ==="
            echo "$aligns"
            if [ -z "$aligns" ]; then
              echo "FAIL: no PT_LOAD in ${so#"$TMP/"}"
              fail=1
              continue
            fi
            for a in $aligns; do
              val=$((a))
              if [ "$val" -lt 16384 ]; then
                echo "FAIL: PT_LOAD Align $a < 0x4000 in ${so#"$TMP/"}"
                fail=1
              fi
            done
          done < <(find "$TMP" -name '*.so' -print0)
          rm -rf "$TMP"
          if [ "$checked" -eq 0 ]; then
            echo "FAIL: no 64-bit .so files found in APK"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "One or more 64-bit native libs are not 16 KB ELF-aligned"
            exit 1
          fi
          echo "Checked $checked 64-bit libs: PT_LOAD Align >= 0x4000"

      - name: Record Compose UI screenshots (Roborazzi)
        run: ./gradlew :composeApp:recordRoborazziDebug --stacktrace

      - name: Compile desktop JVM (shared shell)
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: velum-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: velum-ui-screenshots
          path: composeApp/build/outputs/roborazzi/*.png
          if-no-files-found: warn

  osv-scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          VER=2.0.1
          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/download/v${VER}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan repository
        run: |
          set +e
          # v2 CLI: recursive source scan (no --skip-git; that flag was removed).
          osv-scanner scan source -r --include-git-root ./
          code=$?
          set -e
          # 0 = clean, 1 = vulnerabilities found — warn only until Renovate is enabled.
          if [ "$code" -eq 0 ]; then
            echo "OSV: no known vulnerabilities"
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::OSV reported vulnerabilities (non-blocking; see docs/DEPENDENCY_AUDIT.md)"
            exit 0
          fi
          echo "OSV scanner failed with exit $code"
          exit "$code"

  android-launch-smoke:
    name: Emulator launch smoke
    needs: jvm-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -y
          # Ubuntu 26.04+ dropped the qemu-kvm metapackage; install a concrete provider.
          sudo apt-get install -y bridge-utils libvirt-clients libvirt-daemon-system \
            qemu-system-x86 qemu-utils
          echo 'kvm group members:'
          ls -l /dev/kvm || true

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: velum-debug-apk
          path: apk

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Preinstall API 35 system image (retry on corrupt zip)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          PKG='system-images;android-35;google_apis;x86_64'
          yes | sdkmanager --licenses >/dev/null || true
          for attempt in 1 2 3; do
            echo "Installing $PKG (attempt $attempt)"
            rm -rf "$SDK/system-images/android-35/google_apis/x86_64" || true
            rm -rf "$SDK/.temp" "$SDK/temp" || true
            if sdkmanager --install "$PKG"; then
              echo "System image ready"
              exit 0
            fi
            echo "sdkmanager failed (often corrupt zip); retrying..."
            sleep $((attempt * 8))
          done
          echo "Failed to install $PKG after retries"
          exit 1

      - name: Launch smoke on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # emulator-runner wraps the script in `sh -c`; invoke bash explicitly.
          script: bash scripts/emulator-launch-smoke.sh apk

  android-device-walk:
    name: Emulator device walk (debug + R8 release)
    needs: jvm-android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -y
          sudo apt-get install -y bridge-utils libvirt-clients libvirt-daemon-system \
            qemu-system-x86 qemu-utils
          ls -l /dev/kvm || true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preinstall API 35 system image (retry on corrupt zip)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/cmdline-tools/bin:$PATH"
          PKG='system-images;android-35;google_apis;x86_64'
          yes | sdkmanager --licenses >/dev/null || true
          for attempt in 1 2 3; do
            echo "Installing $PKG (attempt $attempt)"
            rm -rf "$SDK/system-images/android-35/google_apis/x86_64" || true
            rm -rf "$SDK/.temp" "$SDK/temp" || true
            if sdkmanager --install "$PKG"; then
              echo "System image ready"
              exit 0
            fi
            echo "sdkmanager failed (often corrupt zip); retrying..."
            sleep $((attempt * 8))
          done
          echo "Failed to install $PKG after retries"
          exit 1

      - name: Device walk on API 35 emulator (debug + release R8)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash scripts/emulator-device-walk.sh debug device-walk-artifacts &&
            bash scripts/emulator-device-walk.sh release device-walk-artifacts

      - name: Upload device-walk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velum-device-walk
          path: device-walk-artifacts/
          if-no-files-found: warn
