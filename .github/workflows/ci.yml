name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

# Android-first: JVM unit tests + Android assemble + emulator launch smoke.
# iOS KMP targets stay in the project for later; no iOS CI until M3.

jobs:
  jvm-android:
    name: JVM tests + Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Protocol + BLE + AI + core unit tests (JVM)
        run: ./gradlew :plaud-protocol:jvmTest :ble:jvmTest :core:jvmTest :ai:jvmTest --stacktrace

      - name: Assemble signed debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Assert arm64-v8a native libs packaged
        run: |
          set -euo pipefail
          APK=$(ls composeApp/build/outputs/apk/debug/*.apk | head -1)
          echo "Checking $APK"
          unzip -l "$APK" | tee /tmp/apk-listing.txt
          grep -E 'lib/arm64-v8a/libvelum_needle\.so' /tmp/apk-listing.txt
          grep -E 'lib/arm64-v8a/libc\+\+_shared\.so' /tmp/apk-listing.txt
          # network_security_config must be in the APK resources
          unzip -p "$APK" resources.arsc >/dev/null

      - name: Record Compose UI screenshots (Roborazzi)
        run: ./gradlew :composeApp:recordRoborazziDebug --stacktrace

      - name: Compile desktop JVM (shared shell)
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: velum-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: velum-ui-screenshots
          path: composeApp/build/outputs/roborazzi/*.png
          if-no-files-found: warn

  android-launch-smoke:
    name: Emulator launch smoke
    needs: jvm-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -y
          sudo apt-get install -y bridge-utils libvirt-clients libvirt-daemon-system qemu-kvm
          echo 'kvm group members:'
          ls -l /dev/kvm || true

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: velum-debug-apk
          path: apk

      - name: Launch smoke on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(ls apk/*.apk | head -1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            # Cold start — Application.attach parses network_security_config before UI.
            adb shell am force-stop dev.velum.app || true
            START_OUT=$(adb shell am start -W -n dev.velum.app/.MainActivity 2>&1 || true)
            echo "$START_OUT"
            # Give the process a moment to crash if config/manifest is broken.
            sleep 8
            PID=$(adb shell pidof -s dev.velum.app || true)
            echo "pid=$PID"
            CRASH_LOG=$(adb logcat -d -b crash 2>/dev/null || true)
            FULL_LOG=$(adb logcat -d -t 400 2>/dev/null || true)
            if echo "$CRASH_LOG$FULL_LOG" | grep -E 'FATAL EXCEPTION|Nested domain-config|Unable to instantiate application|AndroidRuntime: FATAL'; then
              echo "==== crash buffer ===="
              echo "$CRASH_LOG"
              echo "==== recent logcat ===="
              echo "$FULL_LOG" | tail -200
              exit 1
            fi
            if [[ -z "$PID" ]]; then
              echo "App process not running after launch"
              echo "$START_OUT"
              echo "$FULL_LOG" | tail -200
              exit 1
            fi
            # am start -W should report Status: ok when Activity came up.
            if ! echo "$START_OUT" | grep -qiE 'Status: ok|status=0|Timeout:'; then
              # Timeout still means the Activity started; only fail hard on Error.
              if echo "$START_OUT" | grep -qiE 'Error:|Exception'; then
                echo "am start failed: $START_OUT"
                exit 1
              fi
            fi
            echo "Launch smoke OK (pid=$PID)"
