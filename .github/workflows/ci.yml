name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  jvm-android:
    name: JVM tests + Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Protocol + AI unit tests (JVM)
        run: ./gradlew :plaud-protocol:jvmTest :ai:jvmTest --stacktrace

      - name: Assemble Android debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Compile desktop JVM
        run: ./gradlew :composeApp:compileKotlinDesktop --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velum-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    name: iOS framework (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Link iOS simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
