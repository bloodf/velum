# F-Droid metadata draft (submit via fdroiddata PR).
# Keep in sync with composeApp versionName / versionCode and fastlane/metadata.

Categories:
  - Multimedia
  - Writing
License: MIT
AuthorName: Velum contributors
WebSite: https://github.com/bloodf/velum
SourceCode: https://github.com/bloodf/velum
IssueTracker: https://github.com/bloodf/velum/issues
Changelog: https://github.com/bloodf/velum/releases
Donate: ''

AutoName: Velum
RepoType: git
Repo: https://github.com/bloodf/velum.git

Builds:
  # Universal APK (no -Pvelum.abiSplits): all ABIs, versionCode = defaultConfig.versionCode (1000).
  # Unsigned on purpose (-Pvelum.unsignedRelease=true): F-Droid signs the APK itself.
  # The v1.0.0 tag does not exist yet; the owner creates it at release time.
  - versionName: 1.0.0
    versionCode: 1000
    commit: v1.0.0
    subdir: composeApp
    gradle:
      - yes
    gradleprops:
      - velum.unsignedRelease=true
    output: build/outputs/apk/release/composeApp-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: composeApp/build.gradle.kts|versionCode\s*=\s*(\d+)|composeApp/build.gradle.kts|versionName\s*=\s*"([^"]+)"
CurrentVersion: 1.0.0
CurrentVersionCode: 1000

MaintainerNotes: |
  Local-first; no telemetry. Release signing uses VELUM_UPLOAD_* CI secrets
  (not in the repo). AntiFeatures none intended. Binary deps: sherpa-onnx,
  LiteRT-LM, kopus — see THIRD_PARTY.md.

Description: |-
  Velum is an independent open-source companion for Plaud Note Pro and phone
  microphones. Sync over BLE, transcribe and summarize on-device or with your
  own OpenAI-compatible API. No Velum cloud.

  Not affiliated with Plaud Inc.
